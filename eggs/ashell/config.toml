region = "en-NZ"
enable_esc_key = true

[animations]
enabled = true

[modules]
left = ["Workspaces", "Tray", "MediaPlayer"]
center = ["Tempo"]
right = ["SystemInfo", ["Privacy", "Settings", "Notifications"]]

[appearance]
scale_factor = 1

success_color = "#76946A"
warning_color = "#C0A36E"
danger_color = "#C34043"
text_color = "#dcd7ba"
background_color = "#1f1f28"
workspace_colors = [ "#fab387", "#2D4F67", "#957FB8"]

[appearance.primary_color]
base = "#fab387"
text = "#1e1e2e"

[osd]
enabled = true   # Disabled by default; set to true to enable the OSD overlay
timeout = 1500   # Auto-hide delay in milliseconds
show_volume_percentage = true    # Show percentage text next to volume/mic bar
show_brightness_percentage = true # Show percentage text next to brightness bar

[tempo]
clock_format = "%a %e %b | %l:%M%P"
weather_location = { Coordinates = [-37.78333, 175.28333] }

[tray]
right_click = "menu"
